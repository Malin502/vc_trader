services:
  trader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vc_trader
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

    volumes:
      - .:/app
      - ./data:/app/data
      - ./logs:/app/logs

    working_dir: /app
    
    # 開発環境用: コンテナを起動し続ける
    command: sleep infinity
    
    # 必要に応じてポートを公開
    # ports:
    #   - "8888:8888"  # Jupyter
    #   - "6006:6006"  # TensorBoard