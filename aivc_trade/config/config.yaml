# ============================================================
# AIVC Trade - Trend-Focused Configuration
# ============================================================

exchange:
  name: binance
  symbols:
    - BTCUSDC
    - ETHUSDC
  market_type: spot          # 現物のみ

timeframes:
  signal: 1h                 # シグナル生成足
  execution: 5m              # 執行フィルタ足
  monitor: 5m                # ストップ更新監視足

position:
  max_concurrent: 2          # 同時保有最大数
  cooldown_hours: 48         # 決済後の再エントリ禁止(h) ※後方互換用
  stop_loss_cooldown_hours: 48
  regime_exit_cooldown_hours: 24

costs:
  commission_bps: 10         # 片道手数料 (bps)  = 0.10%
  slippage_bps: 5            # 片道スリッページ (bps) = 0.05%
  roundtrip_cost_bps: 30     # 往復合計 (bps) = 0.30%

# ---------- 1h Indicator Parameters ----------
indicators_1h:
  ema_fast_period: 20
  ema_slow_period: 50
  ema_slope_lookback: 8      # slope 計算用 lookback (bars)
  adx_period: 14
  atr_period: 14
  atrp_z_window: 200         # atrp z-score rolling window
  donchian_period: 20
  volume_sma_period: 20
  swing_low_period: 10       # recent_swing_low 用

# ---------- 5m Indicator Parameters ----------
indicators_5m:
  ema_fast_period: 20
  ema_slow_period: 50
  atr_period: 14
  spread_proxy_window: 20
  micro_vol_percentile_window: 200
  micro_vol_percentile_q: 90 # percentile threshold

# ---------- Regime Thresholds ----------
regime:
  # CHAOS判定
  chaos_atrp_z: 2.0
  chaos_adx_trend_down: 25
  chaos_drop_multiplier: 3.0
  chaos_drop_lookback: 15     # 15h
  chaos_atr_pct: 2.5          # ATR% >= 2.5% → CHAOS
  chaos_ret_1h_pct: 1.8       # |ret_1h| >= 1.8% → CHAOS
  # TREND_UP判定
  trend_slope_min: 0.0015
  trend_adx_min: 20            # ADX >= 20 (was 18)
  trend_atrp_z_min: -0.5
  # RANGE判定
  adx_range_max: 15            # ADX < 15 → RANGE
  # ヒステリシス
  regime_confirm_bars: 3       # regime切替に連続3本必要

# ---------- Entry Conditions ----------
entry:
  ret24h_min_pct: 2.0          # 直近24hリターン条件を緩和（攻撃寄り）
  atr_pct_min: 1.0             # 旧ゲート（後方互換）
  cooldown_bars: 48            # 決済後のクールダウン (bars)
  trigger: breakout            # pullback | breakout | both
  pullback_threshold: 0.015    # |close - ema_fast|/close <= 1.5%
  volume_above_sma: true

entry_filter:
  enabled: true
  adx_min: 20
  trend_ma_type: ema
  trend_ma_period: 200
  atr_pct_min: 0.25            # 0.25%未満の低ボラは除外

entry_signal:
  breakout:
    enabled: true
    lookback_bars: 48
    buffer_pct: 0.10

entry_quality:
  enabled: true
  min_adx: 25
  adx_strict_gt: true
  min_atrp: 0.006
  min_atrp_z: -0.2
  min_volume_ratio: 1.00
  min_slope: 0.0015

# ---------- Risk Management ----------
risk:
  sl_atr_k: 2.0               # 旧キー（後方互換）
  stop_structure_buffer: 0.3   # max(ATR stop, swing_low - 0.3*ATR)
  be_activate_pct: 1.5         # 旧キー（後方互換）
  fee_buffer_bps: 8            # BE移動時の手数料バッファ
  initial_sl:
    enabled: true
    sl_atr_k: 2.0
    min_sl_pct: 0.6
    max_sl_pct: 2.5
  early_fail_exit:
    enabled: true
    window_bars: 6
    min_mfe_pct: 0.25
    max_mae_pct: 0.60
    require_bad_regime: false
    bad_regimes: ["RANGE", "CHAOS", "OFF"]
  breakeven:
    enabled: true
    activate_mfe_pct: 0.8

# ---------- Exit Conditions ----------
exit:
  trail_start_atr: 1.0         # 含み益 >= 1.0*atr で追随開始
  trail_start_mfe_pct: 2.0     # MFE >= 2.0% になるまで追随開始しない
  trail_atr_multiplier: 2.5    # 通常トレール ATR乗数
  trail_min_holding_hours: 2
  trail_min_atrp: 0.004

# ---------- Partial Take-Profit / Runner Mode ----------
partial_tp:
  enabled: true
  threshold_pct: 4.5
  ratio: 0.30                  # 30%部分利確
  max_count: 1                 # 最大1回

runner:
  trail_atr_k: 3.8
  trail_activate_mfe_pct: 4.5
  trail_start_mfe_pct: 2.0     # 旧キー（後方互換）
  stop_buffer_pct: 0.0         # stopノイズバッファ (%)
  range_exit_confirm_bars: 16  # RANGE連続N本 + 条件でExit (was 3/6)
  max_off_bars: 18             # 非TREND_UP最大猶予バー数
  min_mfe_to_hold_pct: 1.5     # 保持継続の最小MFE (%)
  chaos_tighten_k: 1.5         # CHAOS時のstopタイト化 ATR乗数
  chaos_emergency_tp_pct: 5.0  # CHAOS時の緊急部分利確MFE閾値 (%)

# ---------- Exit Tuning ----------
exit_tuning:
  strong_trend_hold:
    enabled: true
    adx_min: 30
    disable_range_exit: true
    disable_partial_tp: true
    partial_tp_threshold_add_pct: 0.0
    trail_atr_k_multiplier: 1.2
  trail_two_stage:
    enabled: true
    mfe_switch_pct: 6.0
    atr_k_before: 3.5
    atr_k_after: 2.7
    apply_to_runner: true
    apply_to_core: true

# ---------- Position Sizing ----------
sizing:
  risk_per_trade: 0.05
  max_notional_pct: 0.95

# ---------- Symbol Score Weights ----------
score:
  w_slope: 0.6
  w_adx: 0.4
  w_atrp_z: -0.3

# ---------- Order ----------
order:
  type: MARKET               # MARKET / LIMIT
  max_entry_slippage_bps: 15

# ---------- Circuit Breaker ----------
circuit_breaker:
  daily_loss_pct: 0.15       # -15% / 24h → 24h停止
  daily_halt_hours: 24
  weekly_loss_pct: 0.25      # -25% / 7d  → 48h停止
  weekly_halt_hours: 48
  max_api_errors: 5          # 連続 API エラー上限

# ---------- Notification ----------
notification:
  enabled: true
  discord_webhook_url: ""    # 環境変数 DISCORD_WEBHOOK_URL で上書き

# ---------- Persistence ----------
persistence:
  state_file: data/position_state.json
  candles_dir: data/candles
  log_dir: logs

# ---------- Backtest ----------
backtest:
  data_dir: data/candles
  initial_equity: 100000.0    # USDC
  start_date: "2025-09-01"
  end_date: "2026-2-13"
  walkforward: false          # true: walk-forward分析を実行
  offline: false              # true: ネットワークアクセス禁止（キャッシュのみ使用）

# ---------- PhaseB ML Entry Filter ----------
ml_filter:
  enabled: false
  model_dir: data/models
  threshold: 0.55                   # Fallback if model meta lacks threshold
  on_missing_model: fail            # pass: 全通過で継続, fail: エラーで停止
  # Label definition
  label_horizon_bars: 24            # H=24h lookahead
  label_tp_thr: 0.015              # +1.5% take-profit threshold
  label_dd_thr: 0.010              # -1.0% max drawdown threshold
  # Walk-forward splits
  train_days: 270
  valid_days: 60
  test_days: 60
  purge_bars: 24                    # Gap in bars between train/valid
  step_days: 60
  min_trades_for_threshold: 50      # Min trades to consider a threshold
  # LightGBM hyperparameters
  num_boost_round: 1200
  early_stopping_rounds: 200
  lgb_params:
    metric: auc
    learning_rate: 0.01
    num_leaves: 15
    max_depth: 4
    min_child_samples: 80
    feature_fraction: 0.90
    bagging_fraction: 0.90
    bagging_freq: 1
    lambda_l1: 0.4
    lambda_l2: 1.0
    min_gain_to_split: 0.0
