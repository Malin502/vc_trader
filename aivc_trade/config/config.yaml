# ============================================================
# AIVC Trade - Trend-Focused Configuration
# ============================================================

exchange:
  name: binance
  symbols:
    - BTCUSDT
    - ETHUSDT
    - SOLUSDT
    - BNBUSDT
    - XRPUSDT
    - DOGEUSDT
    - AVAXUSDT
    - LINKUSDT
    - POLUSDT
    - LTCUSDT
  market_type: spot          # spot / futures

# ---------- Strategy Direction ----------
strategy:
  allow_long: true
  allow_short: true

short:
  enabled: true
  regime:
    require_downtrend_strict: true
    adx_min: 20
    ema_fast: 50
    ema_slow: 200
    ema_slope_lookback: 24
  entry:
    mode: breakdown_follow
    breakdown_lookback: 20
    pullback_zone: [ema20, ema50]
    trigger: bearish_close
    max_setup_bars: 12
  risk:
    initial_stop_mode: swing_high_plus_atr
    atr_period: 14
    atr_k_stop: 0.3
    max_hold_hours: 36
  partial_tp:
    enabled: true
    threshold_pct: 1.2
    ratio: 0.5
  trail:
    activate_mfe_pct: 1.0
    atr_k: 1.5
  filters:
    range_adx_max: 18
    atr_pct_max: 2.5
    cooldown_bars_after_spike: 2
    bullish_spike_body_pct: 2.5

# ---------- Futures (USDT-M Perpetual) ----------
futures:
  enabled: false
  leverage: 3
  margin_cap: 0.90
  fee_rate: 0.0005

timeframes:
  signal: 1h                 # シグナル生成足
  execution: 5m              # 執行フィルタ足
  monitor: 5m                # ストップ更新監視足

position:
  max_concurrent: 2          # 同時保有最大数
  cooldown_hours: 48         # 決済後の再エントリ禁止(h) ※後方互換用
  stop_loss_cooldown_hours: 48
  regime_exit_cooldown_hours: 24

costs:
  commission_bps: 10         # 片道手数料 (bps)  = 0.10%
  slippage_bps: 5            # 片道スリッページ (bps) = 0.05%
  roundtrip_cost_bps: 30     # 往復合計 (bps) = 0.30%

fees:
  enabled: true
  model: binance_spot        # flat | binance_spot
  flat_rate: 0.001           # 0.1% one-way
  binance_spot:
    maker: 0.0010
    taker: 0.0010
    bnb_discount: 0.25
    use_usdc_schedule: false

# ---------- 1h Indicator Parameters ----------
indicators_1h:
  ema_fast_period: 20
  ema_slow_period: 50
  ema_slope_lookback: 8      # slope 計算用 lookback (bars)
  adx_period: 14
  atr_period: 14
  atrp_z_window: 200         # atrp z-score rolling window
  donchian_period: 20
  volume_sma_period: 20
  swing_low_period: 10       # recent_swing_low 用

# ---------- 5m Indicator Parameters ----------
indicators_5m:
  ema_fast_period: 20
  ema_slow_period: 50
  atr_period: 14
  spread_proxy_window: 20
  micro_vol_percentile_window: 200
  micro_vol_percentile_q: 90 # percentile threshold

# ---------- Regime Thresholds ----------
regime:
  allow_short_regime: true    # true: TREND_DOWN有効, false: 旧CHAOS条件#4維持
  # CHAOS判定
  chaos_atrp_z: 2.0
  chaos_adx_trend_down: 25
  chaos_drop_multiplier: 3.0
  chaos_drop_lookback: 15     # 15h
  chaos_atr_pct: 2.5          # ATR% >= 2.5% → CHAOS
  chaos_ret_1h_pct: 1.8       # |ret_1h| >= 1.8% → CHAOS
  # TREND_UP判定
  trend_slope_min: 0.0015
  trend_adx_min: 20            # ADX >= 20 (was 18)
  trend_atrp_z_min: -0.5
  # RANGE判定
  adx_range_max: 15            # ADX < 15 → RANGE
  # ヒステリシス
  regime_confirm_bars: 3       # regime切替に連続3本必要

# ---------- Entry Conditions ----------
entry:
  ret24h_min_pct: 2.0          # 直近24hリターン条件（long/shortのバランス調整）
  atr_pct_min: 1.0             # 旧ゲート（後方互換）
  cooldown_bars: 48            # 決済後のクールダウン (bars)
  trigger: both                # pullback | breakout | both
  pullback_threshold: 0.015    # |close - ema_fast|/close <= 1.5%
  volume_above_sma: true

entry_filter:
  enabled: true
  adx_min: 20
  trend_ma_type: ema
  trend_ma_period: 200
  atr_pct_min: 0.25            # 0.25%未満の低ボラは除外
  min_score_percentile: 0.7
  score_percentile_lookback: 100
  min_atr_pct: 0.3
  min_range_break_pct: 0.5

trend_filter:
  enabled: true
  ema_period: 50
  slope_lookback: 8
  slope_min: 0.0
  adx_enabled: true
  adx_period: 14
  adx_min: 20.0
  mode: ema_slope_and_adx      # ema_slope_only | adx_only | ema_slope_and_adx
  allow_long: true
  allow_short: true

entry_signal:
  breakout:
    enabled: true
    lookback_bars: 48
    buffer_pct: 0.10

entry_quality:
  enabled: true
  min_adx: 30
  adx_strict_gt: true
  min_atrp: 0.006
  min_atrp_z: -0.2
  min_volume_ratio: 1.00
  min_slope: 0.0015

# ---------- Risk Management ----------
risk:
  sl_atr_k: 2.0               # 旧キー（後方互換）
  stop_structure_buffer: 0.3   # max(ATR stop, swing_low - 0.3*ATR)
  be_activate_pct: 1.5         # 旧キー（後方互換）
  fee_buffer_bps: 8            # BE移動時の手数料バッファ
  initial_sl:
    enabled: true
    sl_atr_k: 2.0
    min_sl_pct: 0.6
    max_sl_pct: 2.5
  early_fail_exit:
    enabled: true
    window_bars: 6
    min_mfe_pct: 0.25
    max_mae_pct: 0.60
    require_bad_regime: false
    bad_regimes: ["RANGE", "CHAOS", "OFF"]
  breakeven:
    enabled: true
    activate_mfe_pct: 0.8

initial_stop:
  enabled: true
  method: hybrid              # swing | atr | hybrid
  swing_lookback: 10
  buffer_atr_k: 0.25
  grace_bars: 2
  swing_weight: 0.5
  atr_weight: 0.5
  min_stop_pct: 0.2
  max_stop_pct: 2.5

early_fail:
  enabled: true
  min_hold_bars: 3
  max_bars: 8
  mae_atr_k: 1.5
  mfe_atr_k: 0.3

cooldown:
  enabled: true
  after_loss_hours: 12
  after_3_losses_hours: 24
  after_stoploss_hours: 8
  chaos_mode:
    enabled: true
    trigger_consecutive_stoploss: 3
    halt_hours: 24

regime_guard:
  enabled: true
  lookback_trades: 5
  min_win_rate: 0.4
  min_pf: 0.8
  halt_hours: 48
  soft_resume:
    enabled: true
    resume_check_every_hours: 6
    resume_required_signals: 2
    resume_min_adx: 18.0
    resume_min_slope_pct: 0.0

defensive_derisk:
  enabled: true
  trigger_mae_atr_k: 1.0
  require_mfe_atr_k: 0.3
  action: partial_and_be      # partial_only | be_only | partial_and_be
  partial_ratio: 0.25
  be_buffer_atr_k: 0.05
  once_per_trade: true

entry_overtrade_guard:
  enabled: true
  min_hours_between_entries_per_symbol: 8
  min_hours_between_entries_global: 4
  require_score_improvement: true
  score_improvement_pct: 15.0

timeout_to_runner:
  enabled: true
  check_at_hours: 36
  require_trend_ok: true
  extend_hours: 24
  convert_to_trailing: true
  trailing_atr_k: 2.2

position_scaling:
  enabled: true
  reduce_after_losses: 2
  scale_factor: 0.5
  restore_after_win: true

trade_frequency_guard:
  enabled: true
  min_hours_between_entries: 6
  max_trades_per_24h: 2

# ---------- Exit Conditions ----------
exit:
  trail_start_atr: 1.0         # 含み益 >= 1.0*atr で追随開始
  trail_start_mfe_pct: 2.0     # MFE >= 2.0% になるまで追随開始しない
  trail_atr_multiplier: 2.5    # 通常トレール ATR乗数
  trail_min_holding_hours: 2
  trail_min_atrp: 0.004

# ---------- Partial Take-Profit / Runner Mode ----------
partial_tp:
  enabled: true
  threshold_pct: 4.5
  ratio: 0.30                  # 30%部分利確
  max_count: 1                 # 最大1回

runner:
  trail_atr_k: 3.8
  trail_activate_mfe_pct: 1.0
  trail_start_mfe_pct: 2.0     # 旧キー（後方互換）
  stop_buffer_pct: 0.0         # stopノイズバッファ (%)
  range_exit_confirm_bars: 16  # RANGE連続N本 + 条件でExit (was 3/6)
  max_off_bars: 18             # 非TREND_UP最大猶予バー数
  min_mfe_to_hold_pct: 1.5     # 保持継続の最小MFE (%)
  chaos_tighten_k: 1.5         # CHAOS時のstopタイト化 ATR乗数
  chaos_emergency_tp_pct: 5.0  # CHAOS時の緊急部分利確MFE閾値 (%)
  partial_tp:
    enabled: true
    threshold_pct: 2.0
    ratio: 0.5
  post_partial_trail:
    enabled: true
    atr_k: 2.4

# ---------- Exit Tuning ----------
exit_tuning:
  strong_trend_hold:
    enabled: true
    adx_min: 30
    disable_range_exit: true
    disable_partial_tp: true
    partial_tp_threshold_add_pct: 0.0
    trail_atr_k_multiplier: 1.2
  trail_two_stage:
    enabled: true
    mfe_switch_pct: 6.0
    atr_k_before: 3.5
    atr_k_after: 2.7
    apply_to_runner: true
    apply_to_core: true

# ---------- Position Sizing ----------
sizing:
  risk_per_trade: 0.05
  max_notional_pct: 0.95

# ---------- Symbol Score Weights ----------
score:
  w_slope: 0.6
  w_adx: 0.4
  w_atrp_z: -0.3

# ---------- Order ----------
order:
  type: MARKET               # MARKET / LIMIT
  max_entry_slippage_bps: 15

# ---------- Circuit Breaker ----------
circuit_breaker:
  daily_loss_pct: 0.15       # -15% / 24h → 24h停止
  daily_halt_hours: 24
  weekly_loss_pct: 0.25      # -25% / 7d  → 48h停止
  weekly_halt_hours: 48
  max_api_errors: 5          # 連続 API エラー上限

# ---------- Notification ----------
notification:
  enabled: true
  discord_webhook_url: ""    # 環境変数 DISCORD_WEBHOOK_URL で上書き

# ---------- Persistence ----------
persistence:
  state_file: data/position_state.json
  candles_dir: data/candles
  log_dir: logs

# ---------- Backtest ----------
backtest:
  data_dir: data/candles
  initial_equity: 100000.0    # USDC
  start_date: "2025-09-01"
  end_date: "2026-2-13"
  walkforward: false          # true: walk-forward分析を実行
  offline: false              # true: ネットワークアクセス禁止（キャッシュのみ使用）

# ---------- PhaseB Directional Filter ----------
phaseb:
  enabled: true
  mode: directional
  timeframe: "1h"
  horizon_bars: 24
  cost_bps_roundtrip: 20
  w_mae: 1.0
  log_skips: true
  meta_path: models/phaseb_meta.json

  model_long:
    model_path: models/phaseb_long_lgbm.pkl
    objective: quantile
    alpha: 0.8
    params:
      num_leaves: 63
      learning_rate: 0.03
      n_estimators: 3000
      min_data_in_leaf: 200
      feature_fraction: 0.7
      bagging_fraction: 0.7
      bagging_freq: 1
      lambda_l1: 0.0
      lambda_l2: 1.0
    threshold:
      mode: rank_only
      value: 0.0
    extra_filters:
      enabled: false

  model_short:
    model_path: models/phaseb_short_lgbm.pkl
    objective: quantile
    alpha: 0.8
    params:
      num_leaves: 63
      learning_rate: 0.03
      n_estimators: 3000
      min_data_in_leaf: 200
      feature_fraction: 0.7
      bagging_fraction: 0.7
      bagging_freq: 1
      lambda_l1: 0.0
      lambda_l2: 1.0
    threshold:
      mode: rank_only
      value: 0.0
    extra_filters:
      enabled: true
      atr_pct_min: 0.008
      adx_min: 18

  top_bottom_k:
    enabled: true
    k_long: 3
    k_short: 3
    long_score_min: 0.05
    short_score_max: 0.05

  sizing:
    enabled: true
    k: 0.3              # z-score スケーリング係数
    min_mult: 0.7       # 最小 size 乗数 (70% of base)
    max_mult: 1.3       # 最大 size 乗数 (130% of base)
    rolling_window: 20  # ローリング正規化に使う直近スコア数
    warmup_n: 5         # ウォームアップ期間（この本数に達するまで mult=1.0）
